<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
{{HLCSS}}

:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: #1a1a1a;
  background: #ffffff;
  margin: 0;
  padding: 4px 8px 24px 8px;
}

.entry { border-radius: 6px; padding: 10px; margin: 4px 0; }
.entry.user { background: rgba(74, 123, 213, .13); }
.entry.assistant { background: rgba(0, 128, 128, .08); }
.entry.thinking { background: rgba(155, 89, 182, .13); }
.entry.tool { background: rgba(128, 128, 128, .12); }
.entry.result { background: rgba(128, 128, 128, .08); }
.entry.result.error { background: rgba(192, 64, 64, .25); }

.ehead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ehead .role { font-weight: 600; }
.ehead .time { margin-left: auto; font-size: 11px; opacity: .6; }
.ehead .sidechain { font-size: 10px; opacity: .6; }
.ehead .error { color: #ff8080; font-weight: 600; }

summary { display: flex; align-items: center; gap: 8px; cursor: pointer; }
summary::before { content: "\25B8"; color: #666; font-size: 11px; }
details[open] > summary::before { content: "\25BE"; }
details > summary .time { margin-left: auto; font-size: 11px; opacity: .6; }
details > summary .sidechain { font-size: 10px; opacity: .6; }
details > summary .error { color: #ff8080; font-weight: 600; }

.body { overflow-wrap: anywhere; margin-top: 4px; }
.thinking-body { font-style: italic; opacity: .9; }

.entry.subagent-thread { background: rgba(20, 184, 166, .08); }
.subagent-thread { border-left: 3px solid rgba(20, 184, 166, .4); padding-left: 10px; margin-top: 6px; }

pre {
  background: #f6f8fa;
  border: 1px solid #d0d7de;
  border-radius: 6px;
  padding: 8px 10px;
  overflow: auto;
  font-family: Consolas, Menlo, monospace;
  font-size: 12px;
  line-height: 1.45;
}
pre code { background: none; border: 0; padding: 0; font-size: inherit; }
pre.plain { white-space: pre-wrap; }

/* markdown content */
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1, .md h2 { border-bottom: 1px solid #d0d7de; padding-bottom: .25em; }
.md table { border-collapse: collapse; }
.md th, .md td { border: 1px solid #d0d7de; padding: 4px 8px; }
.md tr:nth-child(2n) { background: #f6f8fa; }
.md blockquote { border-left: 4px solid #d0d7de; margin: .5em 0; padding: .1em .8em; color: #57606a; }
.md img { max-width: 100%; }
.md code { background: #f6f8fa; border-radius: 4px; padding: 1px 5px; font-size: 90%;
           font-family: Consolas, Menlo, monospace; }

/* Chat transcripts are full of XML-ish pseudo-tags (<system-reminder>, ...). Raw
   HTML is escaped by the builder (unclosed tags would nest subsequent entries),
   so these arrive as escaped text wrapped in .ccv-pseudo spans — show them as
   distinct muted blocks. */
.ccv-pseudo {
  display: block;
  opacity: .7;
  font-family: Consolas, Menlo, monospace;
  font-size: 12px;
}

/* find-in-page (Ctrl+F) */
#ccv-find-bar {
  display: none;
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 9999;
  align-items: center;
  gap: 6px;
  background: #ffffff;
  border: 1px solid #d0d7de;
  border-radius: 6px;
  padding: 6px 8px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  font-size: 12px;
}
#ccv-find-bar.visible { display: flex; }
#ccv-find-input { font-size: 12px; padding: 3px 6px; border: 1px solid #d0d7de; border-radius: 4px; width: 200px; }
#ccv-find-count { min-width: 4.5em; opacity: .7; text-align: center; }
#ccv-find-bar button {
  font-size: 12px; padding: 3px 7px; border: 1px solid #d0d7de; border-radius: 4px;
  background: #f6f8fa; cursor: pointer;
}
#ccv-find-bar button:hover { background: #eaeef2; }
.ccv-find-toggle { font-weight: 600; color: #57606a; }
.ccv-find-toggle.active { background: #cfe3ff; border-color: #4a7bd5; color: #1a1a1a; }
#ccv-find-word { text-decoration: underline; }
mark.ccv-find-hit { background: #ffe066; color: inherit; border-radius: 2px; }
mark.ccv-find-hit.active { background: #ff9800; }
</style>
</head>
<body>
<div id="ccv-find-bar">
  <input id="ccv-find-input" type="text" placeholder="Find in conversation" autocomplete="off"/>
  <button id="ccv-find-case" type="button" class="ccv-find-toggle" title="Match case" aria-pressed="false">Aa</button>
  <button id="ccv-find-word" type="button" class="ccv-find-toggle" title="Match whole word" aria-pressed="false">ab</button>
  <span id="ccv-find-count"></span>
  <button id="ccv-find-prev" type="button" title="Previous match (Shift+Enter)">&#8593;</button>
  <button id="ccv-find-next" type="button" title="Next match (Enter)">&#8595;</button>
  <button id="ccv-find-close" type="button" title="Close (Esc)">&#10005;</button>
</div>
{{ENTRIES}}
<script>
{{HLJS}}
</script>
<script>if (window.hljs) hljs.highlightAll();</script>
<script>
// copy-as-markdown
(function () {
  'use strict';

  // The document below is generated by ConversationHtmlBuilder from markdown-ish
  // entries; converting the DOM selection back to markdown keeps the clipboard
  // portable. All copy paths (Ctrl+C, context menu, host command) funnel through
  // the page's 'copy' event, so this covers everything.
  var BLOCK_TAGS = { P: 1, H1: 1, H2: 1, H3: 1, H4: 1, H5: 1, H6: 1, UL: 1, OL: 1,
                     BLOCKQUOTE: 1, PRE: 1, TABLE: 1, HR: 1, DIV: 1, DETAILS: 1, SUMMARY: 1,
                     THEAD: 1, TBODY: 1, TFOOT: 1, TR: 1, TH: 1, TD: 1 };
  var BLOCK_SELECTOR = 'p,h1,h2,h3,h4,h5,h6,ul,ol,blockquote,pre,table,hr,div,details,summary';

  function isElement(n) { return n && n.nodeType === 1; }
  function childNodes(el) { return Array.prototype.slice.call(el.childNodes); }
  function isBlockNode(n) { return isElement(n) && BLOCK_TAGS[n.tagName] === 1; }
  function collapseWs(s) { return s.replace(/\u00a0/g, ' ').replace(/[\t\r\n ]+/g, ' '); }

  function selectionToMarkdown(sel) {
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) return '';
    var out = [];
    for (var i = 0; i < sel.rangeCount; i++) {
      var part = domToMarkdown(sel.getRangeAt(i).cloneContents());
      if (part) out.push(part);
    }
    return out.join('\n\n');
  }

  function domToMarkdown(root) {
    return renderBlocks(root).replace(/\n{3,}/g, '\n\n').trim();
  }

  function renderBlocks(el) {
    var parts = [];
    var inlineBuffer = [];
    function flush() {
      if (!inlineBuffer.length) return;
      var txt = renderInlineNodes(inlineBuffer).trim();
      if (txt) parts.push(txt);
      inlineBuffer.length = 0;
    }
    childNodes(el).forEach(function (n) {
      if (isBlockNode(n)) { flush(); renderBlock(n, parts); }
      else if (n.nodeType === 3) { if (n.textContent.trim()) inlineBuffer.push(n); }
      else if (isElement(n)) inlineBuffer.push(n);
    });
    flush();
    return parts.join('\n\n');
  }

  function renderBlock(el, parts) {
    switch (el.tagName) {
      case 'HR': parts.push('---'); return;
      case 'PRE': parts.push(renderPre(el)); return;
      case 'THEAD': case 'TBODY': case 'TFOOT': case 'TR': parts.push(renderTable(el)); return;
      case 'UL': case 'OL': parts.push(renderList(el)); return;
      case 'TABLE': parts.push(renderTable(el)); return;
      case 'BLOCKQUOTE': {
        var inner = renderBlocks(el);
        parts.push(inner.split('\n').map(function (l) { return '> ' + l; }).join('\n'));
        return;
      }
      case 'P': parts.push(renderParagraph(el)); return;
      case 'H1': case 'H2': case 'H3': case 'H4': case 'H5': case 'H6': {
        var level = parseInt(el.tagName[1], 10);
        parts.push(new Array(level + 1).join('#') + ' ' + renderParagraph(el));
        return;
      }
      default:
        // entry headers and <summary> rows: "User · 12:34:56" -> **User** *(12:34:56)*
        if ((el.tagName === 'SUMMARY' || el.classList.contains('ehead'))
            && el.querySelector('.role, .time, .sidechain, .error')) {
          parts.push(renderHeader(el));
          return;
        }
        if (el.querySelector(BLOCK_SELECTOR)) { parts.push(renderBlocks(el)); return; }
        parts.push(renderParagraph(el));
    }
  }

  function renderParagraph(el) { return renderInlineNodes(childNodes(el)).trim(); }

  function renderHeader(el) {
    var out = [];
    childNodes(el).forEach(function (n) {
      if (!isElement(n)) return;
      var cls = n.classList;
      if (cls.contains('role')) out.push('**' + n.textContent.trim() + '**');
      else if (cls.contains('time')) out.push('*(' + n.textContent.trim() + ')*');
      else if (cls.contains('sidechain')) out.push('*(subagent)*');
      else if (cls.contains('error')) out.push('**' + n.textContent.trim() + '**');
      else out.push(n.textContent.trim());
    });
    return out.join(' ').replace(/\s+/g, ' ');
  }

  function renderPre(pre) {
    var code = pre.querySelector('code');
    var lang = '';
    if (code) {
      var m = (code.className || '').match(/language-([\w+-]+)/);
      if (m) lang = m[1];
    }
    var text = (code || pre).textContent.replace(/^\n/, '').replace(/\n+$/, '');
    var fence = text.indexOf('```') >= 0 ? '````' : '```';
    return fence + (lang && lang !== 'text' ? lang : '') + '\n' + text + '\n' + fence;
  }

  function renderList(listEl) {
    var isOl = listEl.tagName === 'OL';
    var lines = [];
    var i = 0;
    childNodes(listEl).forEach(function (li) {
      if (!isElement(li) || li.tagName !== 'LI') return;
      i++;
      var marker = isOl ? i + '. ' : '- ';
      var indent = new Array(marker.length + 1).join(' ');
      var inlineNodes = [], nested = [];
      childNodes(li).forEach(function (n) {
        if (isElement(n) && (n.tagName === 'UL' || n.tagName === 'OL')) nested.push(n);
        else if (n.nodeType === 3 && !n.textContent.trim()) { /* whitespace between items */ }
        else inlineNodes.push(n);
      });
      var content = renderInlineNodes(inlineNodes).trim();
      content.split('\n').forEach(function (ln, k) {
        lines.push(k === 0 ? marker + ln : indent + ln);
      });
      nested.forEach(function (nl) {
        renderList(nl).split('\n').forEach(function (ln) { lines.push(indent + ln); });
      });
    });
    return lines.join('\n');
  }

  function renderTable(table) {
    var rows = [];
    Array.prototype.forEach.call(table.querySelectorAll('tr'), function (tr) {
      var cells = [];
      childNodes(tr).forEach(function (c) {
        if (!isElement(c)) return;
        cells.push(renderParagraph(c).replace(/\|/g, '\\|').replace(/\n+/g, ' '));
      });
      if (cells.length) rows.push('| ' + cells.join(' | ') + ' |');
    });
    if (rows.length > 1) {
      var cols = (rows[0].match(/\|/g) || []).length - 1;
      var sep = '|';
      for (var k = 0; k < cols; k++) sep += ' --- |';
      rows.splice(1, 0, sep);
    }
    return rows.join('\n');
  }

  function renderInlineNodes(nodes) {
    var out = '';
    nodes.forEach(function (n) {
      var piece = renderInlineNode(n);
      // a piece right after a hard break: drop the HTML indentation/newline that
      // collapseWs turned into a leading space
      if (out.slice(-1) === '\n') piece = piece.replace(/^[\t\r\n ]+/, '');
      out += piece;
    });
    return out;
  }

  function renderInlineNode(n) {
    if (n.nodeType === 3) return collapseWs(n.textContent);
    if (!isElement(n)) return '';
    switch (n.tagName) {
      case 'BR': return '  \n'; // markdown hard break (chat text uses visible line breaks)
      case 'STRONG': case 'B': return wrapInline(n, '**');
      case 'EM': case 'I': return wrapInline(n, '*');
      case 'DEL': case 'S': return wrapInline(n, '~~');
      case 'A': {
        var inner = renderInlineNodes(childNodes(n)).trim();
        var href = n.getAttribute('href');
        return href ? '[' + inner + '](' + href + ')' : inner;
      }
      case 'IMG': {
        var alt = n.getAttribute('alt') || '';
        var src = n.getAttribute('src') || '';
        return '![' + alt + '](' + src + ')';
      }
      case 'CODE': {
        var t = n.textContent;
        return t.indexOf('`') >= 0 ? '`` ' + t + ' ``' : '`' + t + '`';
      }
    }
    if (n.tagName === 'SPAN') {
      var cls = n.classList;
      if (cls.contains('role')) return '**' + n.textContent.trim() + '**';
      if (cls.contains('time')) return '*(' + n.textContent.trim() + ')*';
      if (cls.contains('sidechain')) return '*(subagent)*';
      if (cls.contains('error')) return '**' + n.textContent.trim() + '**';
    }
    return renderInlineNodes(childNodes(n));
  }

  function wrapInline(el, marker) {
    var inner = renderInlineNodes(childNodes(el)).trim();
    return inner ? marker + inner + marker : '';
  }

  document.addEventListener('copy', function (e) {
    var md = selectionToMarkdown(window.getSelection());
    if (!md) return; // nothing selected -> keep the native default
    e.preventDefault();
    if (e.clipboardData) e.clipboardData.setData('text/plain', md);
  });

  // exposed for tests (jsdom) and potential host-side use via InvokeScript
  window.ccvSelectionToMarkdown = selectionToMarkdown;
})();
</script>
<script>
// find-in-page (Ctrl+F) — searches the full transcript, including text inside closed
// <details> sections (collapsing them is CSS-only; the text is always in the DOM), and
// opens whichever <details> a match is inside so it becomes visible.
(function () {
  'use strict';

  var bar = document.getElementById('ccv-find-bar');
  var input = document.getElementById('ccv-find-input');
  var countLabel = document.getElementById('ccv-find-count');
  var caseButton = document.getElementById('ccv-find-case');
  var wordButton = document.getElementById('ccv-find-word');
  var matches = [];
  var currentIndex = -1;
  var debounceHandle = null;
  var caseSensitive = false;
  var wholeWord = false;

  function isWordChar(ch) { return ch !== undefined && /[\p{L}\p{N}_]/u.test(ch); }

  function toggleOption(button, currentValue) {
    var value = !currentValue;
    button.classList.toggle('active', value);
    button.setAttribute('aria-pressed', String(value));
    return value;
  }

  function isOpen() { return bar.classList.contains('visible'); }

  function open() {
    bar.classList.add('visible');
    input.focus();
    input.select();
    if (input.value) runSearch();
  }

  function close() {
    bar.classList.remove('visible');
    clearHighlights();
    updateCount();
  }

  function clearHighlights() {
    var marks = document.querySelectorAll('mark.ccv-find-hit');
    for (var i = 0; i < marks.length; i++) {
      var mark = marks[i];
      var parent = mark.parentNode;
      if (!parent) continue;
      parent.replaceChild(document.createTextNode(mark.textContent), mark);
      parent.normalize();
    }
    matches = [];
    currentIndex = -1;
  }

  function collectTextNodes() {
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var parent = node.parentElement;
        if (!parent || parent.closest('#ccv-find-bar, script, style')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [];
    var n;
    while ((n = walker.nextNode())) nodes.push(n);
    return nodes;
  }

  // wraps every occurrence of `query` in its own text node with <mark class="ccv-find-hit">,
  // honoring the case-sensitive / whole-word toggles; matches never span more than one
  // existing text node
  function highlightMatches(query) {
    var compareQuery = caseSensitive ? query : query.toLowerCase();
    var nodes = collectTextNodes();
    var hits = [];
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      var text = node.nodeValue;
      var compareText = caseSensitive ? text : text.toLowerCase();
      var searchFrom = 0;
      var offsets = [];
      var at;
      while ((at = compareText.indexOf(compareQuery, searchFrom)) !== -1) {
        var end = at + compareQuery.length;
        if (wholeWord && (isWordChar(text[at - 1]) || isWordChar(text[end]))) {
          searchFrom = at + 1; // not a word boundary — retry from the next character
          continue;
        }
        offsets.push(at);
        searchFrom = end;
      }
      if (offsets.length === 0) continue;

      // rebuild this text node as a sequence of plain text + <mark> fragments
      var frag = document.createDocumentFragment();
      var cursor = 0;
      for (var j = 0; j < offsets.length; j++) {
        var start = offsets[j];
        var end = start + query.length;
        if (start > cursor) frag.appendChild(document.createTextNode(text.slice(cursor, start)));
        var mark = document.createElement('mark');
        mark.className = 'ccv-find-hit';
        mark.textContent = text.slice(start, end);
        frag.appendChild(mark);
        hits.push(mark);
        cursor = end;
      }
      if (cursor < text.length) frag.appendChild(document.createTextNode(text.slice(cursor)));
      node.parentNode.replaceChild(frag, node);
    }
    return hits;
  }

  function updateCount() {
    if (!input.value) { countLabel.textContent = ''; return; }
    countLabel.textContent = matches.length === 0 ? 'No results' : (currentIndex + 1) + ' / ' + matches.length;
  }

  function goToMatch(index) {
    if (matches.length === 0) return;
    if (currentIndex >= 0 && matches[currentIndex]) matches[currentIndex].classList.remove('active');
    currentIndex = (index + matches.length) % matches.length;
    var mark = matches[currentIndex];
    // reveal the match if it's inside a collapsed <details> section
    var ancestor = mark.parentElement;
    while (ancestor) {
      if (ancestor.tagName === 'DETAILS' && !ancestor.open) ancestor.open = true;
      ancestor = ancestor.parentElement;
    }
    mark.classList.add('active');
    mark.scrollIntoView({ block: 'center', behavior: 'smooth' });
    updateCount();
  }

  function runSearch() {
    clearHighlights();
    var query = input.value;
    if (query) matches = highlightMatches(query);
    if (matches.length > 0) goToMatch(0);
    else updateCount();
  }

  input.addEventListener('input', function () {
    clearTimeout(debounceHandle);
    debounceHandle = setTimeout(runSearch, 120);
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      goToMatch(currentIndex + (e.shiftKey ? -1 : 1));
    } else if (e.key === 'Escape') {
      e.preventDefault();
      close();
    }
  });

  document.getElementById('ccv-find-next').addEventListener('click', function () { goToMatch(currentIndex + 1); });
  document.getElementById('ccv-find-prev').addEventListener('click', function () { goToMatch(currentIndex - 1); });
  document.getElementById('ccv-find-close').addEventListener('click', close);

  caseButton.addEventListener('click', function () {
    caseSensitive = toggleOption(caseButton, caseSensitive);
    runSearch();
    input.focus();
  });
  wordButton.addEventListener('click', function () {
    wholeWord = toggleOption(wordButton, wholeWord);
    runSearch();
    input.focus();
  });

  document.addEventListener('keydown', function (e) {
    var isFindShortcut = (e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'f' || e.key === 'F');
    if (isFindShortcut) {
      e.preventDefault();
      open();
    } else if (e.key === 'Escape' && isOpen()) {
      close();
    }
  });

  // exposed so the host can trigger find when Ctrl+F is pressed while focus is
  // elsewhere in the app (e.g. the project tree), not inside this webview
  window.ccvOpenFind = open;
})();
</script>
</body>
</html>
