<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
{{HLCSS}}

:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: #1a1a1a;
  background: #ffffff;
  margin: 0;
  padding: 4px 8px 24px 8px;
}

.entry { border-radius: 6px; padding: 10px; margin: 4px 0; }
.entry.user { background: rgba(74, 123, 213, .13); }
.entry.assistant { background: rgba(0, 128, 128, .08); }
.entry.thinking { background: rgba(155, 89, 182, .13); }
.entry.tool { background: rgba(128, 128, 128, .12); }
.entry.result { background: rgba(128, 128, 128, .08); }
.entry.result.error { background: rgba(192, 64, 64, .25); }

.ehead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ehead .role { font-weight: 600; }
.ehead .time { margin-left: auto; font-size: 11px; opacity: .6; }
.ehead .sidechain { font-size: 10px; opacity: .6; }
.ehead .error { color: #ff8080; font-weight: 600; }

summary { display: flex; align-items: center; gap: 8px; cursor: pointer; }
summary::before { content: "\25B8"; color: #666; font-size: 11px; }
details[open] > summary::before { content: "\25BE"; }
details > summary .time { margin-left: auto; font-size: 11px; opacity: .6; }
details > summary .sidechain { font-size: 10px; opacity: .6; }
details > summary .error { color: #ff8080; font-weight: 600; }

.body { overflow-wrap: anywhere; margin-top: 4px; }
.thinking-body { font-style: italic; opacity: .9; }

pre {
  background: #f6f8fa;
  border: 1px solid #d0d7de;
  border-radius: 6px;
  padding: 8px 10px;
  overflow: auto;
  font-family: Consolas, Menlo, monospace;
  font-size: 12px;
  line-height: 1.45;
}
pre code { background: none; border: 0; padding: 0; font-size: inherit; }
pre.plain { white-space: pre-wrap; }

/* markdown content */
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1, .md h2 { border-bottom: 1px solid #d0d7de; padding-bottom: .25em; }
.md table { border-collapse: collapse; }
.md th, .md td { border: 1px solid #d0d7de; padding: 4px 8px; }
.md tr:nth-child(2n) { background: #f6f8fa; }
.md blockquote { border-left: 4px solid #d0d7de; margin: .5em 0; padding: .1em .8em; color: #57606a; }
.md img { max-width: 100%; }
.md code { background: #f6f8fa; border-radius: 4px; padding: 1px 5px; font-size: 90%;
           font-family: Consolas, Menlo, monospace; }

/* Chat transcripts are full of XML-ish pseudo-tags (<system-reminder>, ...). The
   browser treats them as unknown inline elements, which makes their text content
   blend into the surrounding paragraph. Show them as distinct muted blocks
   (replaces the old zero-width-space workaround of the Markdown.Avalonia engine). */
system-reminder, command-message, command-name, command-args, command-contents,
local-command-stdout, local-command-stderr, bash-input, bash-stdout, bash-stderr,
thinking, artifact-marker {
  display: block;
  opacity: .7;
  font-family: Consolas, Menlo, monospace;
  font-size: 12px;
}
</style>
</head>
<body>
{{ENTRIES}}
<script>
{{HLJS}}
</script>
<script>if (window.hljs) hljs.highlightAll();</script>
</body>
</html>
